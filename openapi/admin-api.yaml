openapi: 3.1.0
info:
  title: TradeSura admin API
  version: "1"
  description: |
    The API the TradeSura Admin app (a separate Next.js app) uses for real data.
    Server to server only: no browser calls it, and it isn't for the engineers'
    mobile app (those routes are under /api and unchanged).

    **Auth.** Every call carries `Authorization: Bearer <token>`: an HS256 JWT
    signed with `ADMIN_API_SECRET`, issuer `tradesura-admin`, audience
    `tradesura-api:admin`, living at most 120 seconds (the admin app signs one
    per call, for 60). Claims: `sub` (the admin's ID), `name`, `role`, `perms`
    (the permissions their role holds, from the list in
    lib/admin-api/permissions.ts) and optional `rid` (the admin app's request
    ID). Each route names the permission it needs; it's checked here as well
    as in the admin app. Engineers' app tokens (SESSION_SECRET) are never
    accepted, and the two secrets must differ.

    **Errors.** Every failure is `{ "error": { "code", "message", "fields"? } }`
    with a status code: 400 VALIDATION (fields names each bad field, and the
    message is the first field's own message when no other is given), 401
    UNAUTHENTICATED, 403 FORBIDDEN, 404 NOT_FOUND, 409 CONFLICT, 413, 415, 503
    NOT_CONFIGURED (ADMIN_API_SECRET unset), 503 TIMEOUT (a heavy read ran past
    10 seconds and Postgres stopped it; try a shorter range), 500 INTERNAL.
    Messages are written for admins and safe to show. Unknown query or body
    fields are refused, as is any text containing a NUL character (400), and
    dates outside 2000–2099 (400). Search text is matched literally: % and _
    aren't wildcards.

    **Lists** take `page` (from 1) and `size` (1–100, default 25) and answer
    `{ items, page, size, total }`. Each sort orders by the value its column
    shows. The engineer and customer lists also stream whole, for CSV
    exports, as NDJSON (`…/export`): one item per line, then
    `{"end":true,"count":N}`; a stream without that last line didn't finish.

    **Audit.** Every change is an Event row with actor type ADMIN, the admin's
    name and role, the request ID and the reason given.

    **Responses** are never cached (`Cache-Control: no-store`) and echo
    `X-Request-Id`.
servers:
  - url: /api/admin/v1
security:
  - adminToken: []

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    dir: { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
    from: { name: from, in: query, required: true, description: Start of the range (ISO instant, inclusive), schema: { type: string, format: date-time } }
    to: { name: to, in: query, required: true, description: End of the range (ISO instant, exclusive; at most 400 days after from), schema: { type: string, format: date-time } }
    engineerId: { name: engineerId, in: path, required: true, schema: { type: string } }
    customerId: { name: customerId, in: path, required: true, schema: { type: string } }
    noteId: { name: noteId, in: path, required: true, schema: { type: string } }
    slug: { name: slug, in: path, required: true, schema: { type: string }, description: "The town's slug (holmfirth)" }
  schemas:
    TownPageState: { type: string, enum: [public, held, not_public], description: "Public: on the web. Held: an admin is holding it back. Not public: nobody listed there yet." }
    TownPerson: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, NOT_CONFIGURED, UPSTREAM, TIMEOUT, INTERNAL] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
    Page:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    NoteBody:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    Note:
      type: object
      properties:
        id: { type: string }
        body: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
    Activity:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string, description: Event name, e.g. engineer_paused, offer_sent }
                  at: { type: string, format: date-time }
                  actor: { type: object, properties: { type: { type: string, enum: [ENGINEER, CUSTOMER, SYSTEM, ADMIN] }, id: { type: [string, "null"] }, name: { type: [string, "null"] } } }
                  reason: { type: [string, "null"] }
    Contact:
      type: object
      description: Both, or just the one asked for with `field`.
      properties:
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { const: true } }
    Lock:
      type: [object, "null"]
      required: [holderId, holderName, until]
      properties:
        holderId: { type: string }
        holderName: { type: string }
        until: { type: string, format: date-time }
    NameMatch: { type: string, enum: [match, likely, none] }
    TypeMismatch: { type: string, enum: [name_says_company, type_says_company], description: "The name says Ltd, Limited, PLC or LLP and the type isn't a company, or the reverse." }
    CustomerStatus:
      type: string
      enum: [offer_sent, offer_failed, offer_unconfirmed, offer_opened, thinking, dd_started, active, payment_failing, paused, cancelled, no_plan]
      description: "Where a customer is with their current plan (lib/admin/metrics.ts customerStatus): offered (sent, failed, not confirmed, opened), thinking about it, started Direct Debit, active, cancelled."
    TestMark: { type: object, required: [isTest, markedAt, markedBy], properties: { isTest: { type: boolean }, markedAt: { type: [string, "null"] }, markedBy: { type: [string, "null"] } } }
    VerificationStatus: { type: string, enum: [pending, verified, rejected, not_submitted] }
    EngineerStatus: { type: string, enum: [active, inactive, paused, banned, left], description: "Banned, left or paused by standing; otherwise active with a delivered offer in the last 7 days (lib/admin/metrics.ts), else inactive." }
    EngineerStanding: { type: string, enum: [active, paused, banned, left] }
    PlanStatus: { type: string, enum: [PENDING, ACTIVE, PAUSED, CANCELLED] }
    CheckStage: { type: string, enum: [not_submitted, no_card, card, register, recheck, passed, card_failed, suspended], description: "Live first (Matt, 4 Nov): no_card, card (card check waiting), register (live, register check due), recheck, passed, card_failed, suspended" }
    CardCheck: { type: [string, "null"], enum: [waiting, passed, failed, no_card, null], description: passed means live }
    RegisterCheck: { type: [string, "null"], enum: [due, recheck_due, passed, suspended, null], description: On the live Gas Safe Register, behind the card check }
    VerificationRow:
      type: object
      required: [id, name, business, businessType, teamOf, licenceNo, registrationNo, town, cardExpiry, submittedAt, waitingSince, stage, cardCheck, registerCheck, liveSince, nextRecheck, recheckReason, decidedAt, rejectReason, claimedBy, canTextChase, signals]
      properties:
        id: { type: string, description: The engineer's ID (a case is the engineer's) }
        name: { type: string }
        business: { type: string }
        businessType: { type: [string, "null"], description: sole_trader, ltd or partnership }
        teamOf: { type: [string, "null"], description: The business a staff engineer works for }
        licenceNo: { type: [string, "null"], description: "The engineer's 7-digit licence number" }
        registrationNo: { type: [string, "null"], description: "The business's Gas Safe registration number (staff: the owner's). Before sign-up asked for both, a single number that isn't 7 digits is read as this." }
        town: { type: [string, "null"] }
        cardExpiry: { type: [string, "null"], format: date, description: "The ID card's expiry, given with the photo; null when not given" }
        submittedAt: { type: string, format: date-time }
        waitingSince: { type: [string, "null"], format: date-time, description: "What the waiting time runs from: the latest card upload (card), going live (register), the re-check falling due or being asked for (recheck)" }
        stage: { $ref: "#/components/schemas/CheckStage" }
        cardCheck: { $ref: "#/components/schemas/CardCheck" }
        registerCheck: { $ref: "#/components/schemas/RegisterCheck" }
        liveSince: { type: [string, "null"], format: date-time }
        nextRecheck: { type: [string, "null"], format: date }
        recheckReason: { type: [string, "null"] }
        decidedAt: { type: [string, "null"], format: date-time }
        rejectReason: { type: [string, "null"] }
        claimedBy: { type: [string, "null"], description: Who is checking it now }
        canTextChase: { type: boolean }
        signals:
          type: object
          required: [hasCard, cardExpiryFar, companyNotActive, typeMismatch, duplicates]
          properties:
            hasCard: { type: boolean }
            cardExpiryFar: { type: boolean, description: The card's expiry is more than 13 months away }
            companyNotActive: { type: boolean }
            typeMismatch: { oneOf: [{ $ref: "#/components/schemas/TypeMismatch" }, { type: "null" }] }
            duplicates: { type: integer }
    VerificationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [counts]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/VerificationRow" } }
            counts:
              type: object
              required: [card, register, no_card, recheck, duplicates, pending, decided]
              properties:
                card: { type: integer }
                register: { type: integer }
                no_card: { type: integer }
                recheck: { type: integer }
                duplicates: { type: integer }
                pending: { type: integer }
                decided: { type: integer }
    VerificationDetail:
      type: object
      required: [id, name, firstName, lastName, business, businessType, submittedAt, waitingSince, stage, tab, revision, lock, checks, history, gasSafe, submitted, contact, canTextChase, customersOnPlans, card, company, typeMismatch, duplicates, queue, warnings]
      properties:
        id: { type: string }
        name: { type: string }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        business: { type: string }
        tradingName: { type: [string, "null"] }
        legalName: { type: [string, "null"] }
        businessType: { type: [string, "null"] }
        teamOf: { type: [object, "null"], properties: { id: { type: string }, business: { type: string } } }
        submittedAt: { type: string, format: date-time }
        waitingSince: { type: [string, "null"], format: date-time }
        stage: { $ref: "#/components/schemas/CheckStage" }
        tab: { type: [string, "null"], enum: [card, register, no_card, recheck, decided, null] }
        revision: { type: string, description: "Changes whenever anything the check looks at changes. Send it with a step: if it no longer matches, the step is refused (409)." }
        standing: { type: string }
        lock: { $ref: "#/components/schemas/Lock" }
        checks:
          type: object
          properties:
            card: { $ref: "#/components/schemas/CardCheck" }
            register: { $ref: "#/components/schemas/RegisterCheck" }
            liveSince: { type: [string, "null"], format: date-time }
            registerCheckedAt: { type: [string, "null"], format: date-time }
            nextRecheck: { type: [string, "null"], format: date, description: "Card expiry + 14 days, else a year after the last register check" }
            recheckRequested: { type: [object, "null"], properties: { at: { type: string }, reason: { type: [string, "null"] } } }
            suspended: { type: [object, "null"], properties: { at: { type: string }, reason: { type: [string, "null"] } } }
            failedReason: { type: [string, "null"] }
        history:
          type: array
          description: The check's steps, newest first
          items: { type: object, properties: { kind: { type: string, enum: [card_passed, card_failed, register_passed, suspended, recheck_requested] }, at: { type: string }, byName: { type: [string, "null"] }, note: { type: [string, "null"] } } }
        gasSafe:
          type: object
          required: [licenceNo, registrationNo, registerUrl]
          properties:
            licenceNo: { type: [string, "null"] }
            registrationNo: { type: [string, "null"] }
            registerUrl: { type: string, description: The live Gas Safe Register }
        customersOnPlans: { type: integer, description: Customers on a live plan, who can be told if the engineer is suspended }
        submitted:
          type: object
          description: What the engineer gave, to check against the card and the live register. cardExpiry (YYYY-MM-DD) is null until they give it with the photo.
          properties: { name: { type: string }, business: { type: string }, categories: { type: [string, "null"] }, postcode: { type: [string, "null"] }, town: { type: [string, "null"] }, cardExpiry: { type: [string, "null"] } }
        contact: { type: [object, "null"], description: "Masked; only for an admin with pii:reveal", properties: { email: { type: string }, phone: { type: [string, "null"] } } }
        canTextChase: { type: boolean, description: "A chase can go by text: they have a mobile and agreed to texts about finishing setting up" }
        card: { type: object, required: [available], properties: { available: { type: boolean } } }
        company:
          type: [object, "null"]
          properties:
            name: { type: [string, "null"] }
            number: { type: [string, "null"] }
            status: { type: [string, "null"] }
            officers: { type: [array, "null"], items: { type: object, properties: { name: { type: string }, role: { type: string }, match: { $ref: "#/components/schemas/NameMatch" }, matchesApplicant: { type: boolean, description: match or likely } } } }
            profile: { type: [object, "null"], description: "Companies House's record, when it answered", properties: { number: { type: string }, name: { type: string }, type: { type: string }, status: { type: string }, registeredOffice: { type: [string, "null"] } } }
        typeMismatch:
          type: [object, "null"]
          properties:
            kind: { $ref: "#/components/schemas/TypeMismatch" }
            search: { type: [array, "null"], description: "Companies House name search, when no company number was given", items: { type: object, properties: { number: { type: string }, name: { type: string }, status: { type: string }, type: { type: string }, address: { type: [string, "null"] } } } }
        warnings: { type: array, description: "Everything still open. Approving over any needs a reason (400 otherwise).", items: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } } }
        qualifications: { type: array, items: { type: object, properties: { code: { type: string }, title: { type: string }, confirmedAt: { type: string } } } }
        duplicates:
          type: array
          items:
            type: object
            required: [engineerId, reason, name, business, status]
            properties:
              engineerId: { type: string }
              reason: { type: string, enum: [company_number, registration_number, business_name, name_and_postcode] }
              name: { type: string }
              business: { type: string }
              status: { type: string }
        queue:
          type: [object, "null"]
          properties:
            position: { type: integer }
            total: { type: integer }
            previousId: { type: [string, "null"] }
            nextId: { type: [string, "null"] }
    EngineerRow:
      type: object
      required: [id, name, business, slug, town, type, channel, isStaff, isTest, status, verification, paymentsReady, plansLive, tiersLive, customers, customersOnPlans, lastOfferAt, joinedAt]
      properties:
        id: { type: string }
        name: { type: string }
        business: { type: string }
        slug: { type: string }
        town: { type: [string, "null"] }
        type: { type: [string, "null"] }
        channel: { type: [string, "null"] }
        isStaff: { type: boolean }
        isTest: { type: boolean, description: Marked as test data; left out of every figure }
        status: { $ref: "#/components/schemas/EngineerStatus" }
        verification: { $ref: "#/components/schemas/VerificationStatus" }
        paymentsReady: { type: boolean }
        plansLive: { type: integer, description: Customer plans live now (ACTIVE). Sort plans. }
        tiersLive: { type: integer, description: The engineer's own plans on sale (LIVE), as counts.tiersLive on the record. Sort tiers. }
        customers: { type: integer, description: Everyone on their book. Sort customers. }
        customersOnPlans: { type: integer, description: Customers with an active or paused plan, as counts.customersOnPlans on the record. Sort customersOnPlans. }
        lastOfferAt: { type: [string, "null"], format: date-time, description: Sort lastOffer (never offered sorts last). }
        joinedAt: { type: string, format: date-time }
    EngineerPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/EngineerRow" } } }
    PostalAddress:
      type: object
      additionalProperties: false
      required: [lines, town, postcode]
      properties:
        lines: { type: array, minItems: 1, maxItems: 3, items: { type: string, maxLength: 160 }, description: Street lines; blanks are dropped }
        town: { type: string, maxLength: 80 }
        postcode: { type: string, description: A UK postcode, normalised (HD9 2TT) }
    EngineerDetail:
      type: object
      description: The fields the admin app reads; the response carries a few more (see lib/admin/engineers.ts getEngineer).
      required: [id, name, business, type, companyNumber, town, postcode, serviceArea, addresses, company, test, contact, joinedAt, channel, letterBatch, referralCodeGiven, letter, status, pause, ban, leftAt, verification, gasSafe, founding, chase, cancelRate, payments, counts, cancelReasons, team, referrals, tiers, recentCustomers, payouts, lifetimePayoutsPence, steps, offersLast7Days]
      properties:
        id: { type: string }
        name: { type: string }
        business: { type: string }
        type: { type: [string, "null"] }
        companyNumber: { type: [string, "null"] }
        town: { type: [string, "null"] }
        postcode: { type: [string, "null"] }
        serviceArea: { type: [string, "null"] }
        addresses:
          type: object
          description: "Each address apart (lib/addresses.ts): trading sets the town and town page; correspondence (the pack address) is where the member pack and all post go; the registered office is Companies House's"
          required: [areasCovered, signupPostcode, postal, registeredOffice, trading, correspondence, tradingIsRegisteredOffice]
          properties:
            areasCovered: { type: array, items: { type: string } }
            signupPostcode: { type: [string, "null"], description: The engineer's postcode (the trading address's, once saved) }
            postal: { type: [string, "null"], description: Where the member pack goes (as correspondence.address) }
            registeredOffice: { type: [string, "null"], description: From Companies House }
            trading:
              type: [object, "null"]
              description: "source null: read from the pack address, not saved as the trading address yet"
              properties:
                lines: { type: array, items: { type: string } }
                town: { type: string }
                postcode: { type: string }
                source: { type: [string, "null"], enum: [signup, engineer, admin, null] }
                updatedAt: { type: [string, "null"], format: date-time }
                updatedBy: { type: [string, "null"] }
            correspondence: { type: object, properties: { address: { type: [string, "null"] }, sameAsTrading: { type: boolean } } }
            tradingIsRegisteredOffice: { type: boolean, description: "The trading address has the registered office's postcode: usually not where they work" }
        company: { type: [object, "null"], properties: { name: { type: string }, type: { type: string }, status: { type: string } } }
        test: { $ref: "#/components/schemas/TestMark" }
        contact:
          type: object
          required: [email, phone, phoneVerifiedAt, setupTextConsentAt, marketingConsent]
          properties:
            email: { type: string, description: Masked }
            phone: { type: [string, "null"], description: Masked }
            phoneVerifiedAt: { type: [string, "null"], format: date-time }
            setupTextConsentAt: { type: [string, "null"], format: date-time, description: "When they agreed to \"TradeSura can text me to help me finish setting up\"" }
            marketingConsent: { type: boolean, description: "\"Send me tips and product updates\", asked at sign-up" }
        joinedAt: { type: string, format: date-time }
        channel: { type: [string, "null"] }
        letterBatch: { type: [string, "null"] }
        referralCodeGiven: { type: [string, "null"], description: The referral code they typed at sign-up }
        letter: { type: [object, "null"], description: "The letter they came from: the claim code redeemed (code null when only the batch is known)", properties: { code: { type: [string, "null"] }, batch: { type: string }, variant: { type: [string, "null"] }, redeemedAt: { type: [string, "null"], format: date-time } } }
        gasSafe:
          type: object
          description: The Gas Safe ID card's details (Matt, 4 Nov). There is no stored copy of the register.
          properties:
            licenceNo: { type: [string, "null"], description: The engineer's own licence number (7 digits) }
            registrationNo: { type: [string, "null"], description: "The business's registration number (a staff member's comes from the owner)" }
            categories: { type: [string, "null"] }
            cardOnFile: { type: boolean }
            cardExpiresOn: { type: [string, "null"], format: date }
            qualifications: { type: array, items: { type: object, properties: { code: { type: string }, title: { type: string }, confirmedAt: { type: string } } } }
            nextRegisterCheck: { type: [string, "null"], format: date, description: "14 days after the card's expiry, else 12 months after the last register check; null before the first (lib/admin/verifications.ts)" }
        founding:
          type: object
          description: "Read from the app's own record (lib/founding.ts via lib/admin/founding.ts): a Founding Member claimed their letter by its date; the first spotsPerTown of them in a town to complete their account hold its top spots, each released without a customer signed within spotDays."
          required: [rules, member, label, town, spot]
          properties:
            rules: { type: object, properties: { spotsPerTown: { type: integer }, spotDays: { type: integer }, reminderDays: { type: array, items: { type: integer } } } }
            member: { type: boolean, description: Holds the Founding badge (permanent) }
            label: { type: string, enum: ["Founding · top spot", Founding, Standard] }
            town: { type: [string, "null"], description: The town of their spot }
            spot:
              type: [object, "null"]
              description: "Their open top spot, else their latest released one. holding: position counts from 1 (held longest first), kept once they've signed a customer. released: reason no_customer or left_town."
              properties:
                state: { type: string, enum: [holding, released] }
                position: { type: integer }
                heldFrom: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                daysLeft: { type: integer }
                kept: { type: boolean }
                remindersSent: { type: array, items: { type: integer }, description: Days left when each reminder went }
                releasedAt: { type: string, format: date-time }
                reason: { type: [string, "null"] }
        chase:
          type: [object, "null"]
          description: "Days since their last delivered offer (or since going live) and the follow-up ladder step (lib/admin/metrics.ts CALL_LADDER: 3, 5, 7, 10 days); null unless live, in good standing and not staff"
          properties:
            lastDeliveredOfferAt: { type: [string, "null"], format: date-time }
            countingFrom: { type: string, enum: [last_offer, live] }
            days: { type: integer }
            step: { type: [object, "null"], properties: { step: { type: integer }, label: { type: string }, channel: { type: string, enum: [push, whatsapp, email, call] }, fromDays: { type: integer } } }
        cancelRate:
          type: object
          description: "The app's cancelRatePercent over windowDays: plans cancelled after going live, over those plus plans live now. Flagged with at least rule.minCustomers customers and rule.minCancelled cancellations, above rule.timesAverage × averagePercent."
          properties:
            percent: { type: [number, "null"] }
            cancelled: { type: integer }
            live: { type: integer }
            windowDays: { type: integer }
            averagePercent: { type: [number, "null"] }
            rule: { type: object, properties: { minCustomers: { type: integer }, minCancelled: { type: integer }, timesAverage: { type: number } } }
            flagged: { type: boolean }
        status: { $ref: "#/components/schemas/EngineerStatus" }
        pause: { type: [object, "null"], properties: { at: { type: string }, reason: { type: [string, "null"] } } }
        ban: { type: [object, "null"], properties: { at: { type: string }, reason: { type: [string, "null"] } } }
        leftAt: { type: [string, "null"] }
        verification:
          type: object
          description: "Live first (Matt, 4 Nov): the card check puts them live; the register check on the live Gas Safe Register follows."
          required: [status, card, register, liveSince, registerCheckedAt, suspendedAt, recheckRequested, rejectedAt, rejectReason]
          properties:
            status: { $ref: "#/components/schemas/VerificationStatus" }
            card: { type: [string, "null"], enum: [waiting, passed, failed, no_card, null] }
            register: { type: [string, "null"], enum: [due, recheck_due, passed, suspended, null] }
            liveSince: { type: [string, "null"], format: date-time }
            registerCheckedAt: { type: [string, "null"], format: date-time }
            suspendedAt: { type: [string, "null"], format: date-time }
            recheckRequested: { type: [object, "null"], properties: { at: { type: string, format: date-time }, reason: { type: [string, "null"] } } }
            rejectedAt: { type: [string, "null"] }
            rejectReason: { type: [string, "null"] }
        payments: { type: object, required: [accountId, connected, chargesEnabled, payoutsEnabled], properties: { accountId: { type: [string, "null"] }, connected: { type: boolean }, chargesEnabled: { type: boolean, description: Payments set up (the activation step reads the same flag) }, payoutsEnabled: { type: boolean } } }
        counts:
          type: object
          required: [customers, customersOnPlans, tiersLive, plans]
          properties:
            customers: { type: integer }
            customersOnPlans: { type: integer }
            tiersLive: { type: integer }
            plans: { type: object, required: [ACTIVE, PENDING, PAUSED, CANCELLED], properties: { ACTIVE: { type: integer }, PENDING: { type: integer }, PAUSED: { type: integer }, CANCELLED: { type: integer } } }
        cancelReasons: { type: array, description: "Each cancelled plan's latest reason, counted (none: no reason given)", items: { type: object, properties: { reason: { type: string }, count: { type: integer } } } }
        team:
          type: object
          required: [staff]
          properties:
            staff: { type: array, items: { type: object, required: [id, name, email, phone, removedAt], properties: { id: { type: string }, name: { type: string }, email: { type: string }, phone: { type: [string, "null"] }, removedAt: { type: [string, "null"] } } } }
        referrals:
          type: object
          required: [code, referredBy, earnedPence, paidPence, owedPence, people]
          properties:
            code: { type: string }
            referredBy: { type: [object, "null"], properties: { id: { type: string }, business: { type: string } } }
            earnedPence: { type: integer }
            paidPence: { type: integer }
            owedPence: { type: integer }
            people: { type: array, items: { type: object, properties: { id: { type: string }, business: { type: string }, joinedAt: { type: string }, status: { $ref: "#/components/schemas/EngineerStatus" }, earnedPence: { type: integer }, currentRatePercent: { type: [number, "null"] } } } }
        tiers: { type: array, items: { type: object, required: [id, name, status, priceMonthlyPence, options], properties: { id: { type: string }, name: { type: string }, status: { type: string, enum: [DRAFT, LIVE, STOPPED] }, priceMonthlyPence: { type: integer }, options: { type: array, items: { type: string } } } } }
        recentCustomers: { type: array, items: { type: object, required: [id, name, postcode, planStatus, status, since], properties: { id: { type: string }, name: { type: string }, postcode: { type: [string, "null"] }, planStatus: { oneOf: [{ $ref: "#/components/schemas/PlanStatus" }, { type: "null" }] }, status: { $ref: "#/components/schemas/CustomerStatus" }, since: { type: string } } } }
        payouts: { type: array, items: { type: object, required: [id, paidOn, amountPence, status], properties: { id: { type: string }, paidOn: { type: string, format: date }, amountPence: { type: integer }, status: { const: paid } } } }
        lifetimePayoutsPence: { type: integer }
        steps: { type: array, description: "The activation steps in the funnel's order (lib/admin/metrics.ts FUNNEL_STEPS); at is null when the step is reached without a recorded date", items: { type: object, required: [key, label, reached, at], properties: { key: { type: string }, label: { type: string }, reached: { type: boolean }, at: { type: [string, "null"] } } } }
        offersLast7Days: { type: integer, description: Delivered offers in the last ACTIVE_WINDOW_DAYS }
    CustomerRow:
      type: object
      required: [id, name, engineer, town, postcode, contact, plan, status, firstPaymentAt, isTest, source, addedAt]
      properties:
        id: { type: string }
        name: { type: string }
        engineer: { type: object, required: [id, business], properties: { id: { type: string }, business: { type: string } } }
        town: { type: [string, "null"] }
        postcode: { type: [string, "null"], description: Their first home's. Sort postcode. }
        contact: { type: object, properties: { phone: { type: string }, email: { type: [string, "null"] } }, description: Masked }
        plan:
          type: [object, "null"]
          description: "The plan that best describes them now: live first, then the newest. Sort price (its price) and since (its start, or addedAt with none)."
          required: [id, ref, name, status, priceMonthlyPence, startedAt, cancelledAt, cancelReason, payment]
          properties:
            id: { type: string }
            ref: { type: string }
            name: { type: [string, "null"] }
            status: { $ref: "#/components/schemas/PlanStatus" }
            priceMonthlyPence: { type: [integer, "null"], description: "Agreed, or until they pick, the offered plan's" }
            startedAt: { type: [string, "null"], format: date-time }
            cancelledAt: { type: [string, "null"], format: date-time }
            cancelReason: { type: [string, "null"] }
            payment: { type: string, enum: [failing, paid, none], description: paid is a payment over £0 (lib/admin/metrics.ts payments) }
        status: { $ref: "#/components/schemas/CustomerStatus" }
        firstPaymentAt: { type: [string, "null"], format: date-time }
        isTest: { type: boolean, description: The customer or their engineer is marked as test data }
        source: { type: string }
        addedAt: { type: string, format: date-time }
    CustomerPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/CustomerRow" } } }
    CustomerDetail:
      type: object
      description: The fields the admin app reads; see lib/admin/customers.ts getCustomer for the rest.
      required: [id, name, contact, smsOptOut, stripeCustomerId, source, addedAt, status, firstPaymentAt, test, winBack, engineer, homes, plans, payments, zeroInvoicesHidden]
      properties:
        id: { type: string }
        name: { type: string }
        contact: { type: object, properties: { phone: { type: string }, email: { type: [string, "null"] } }, description: Masked }
        smsOptOut: { type: boolean, description: Their own opt-out or a platform suppression }
        stripeCustomerId: { type: [string, "null"] }
        source: { type: string }
        addedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CustomerStatus" }
        firstPaymentAt: { type: [string, "null"], format: date-time }
        test: { allOf: [{ $ref: "#/components/schemas/TestMark" }, { type: object, properties: { viaEngineer: { type: boolean } } }] }
        winBack: { type: object, properties: { available: { type: boolean }, reason: { type: [string, "null"] } } }
        engineer: { type: object, properties: { id: { type: string }, business: { type: string } } }
        homes: { type: array, items: { type: object, required: [addressLine1, addressLine2, town, postcode], properties: { addressLine1: { type: string }, addressLine2: { type: [string, "null"] }, town: { type: [string, "null"] }, postcode: { type: string } } } }
        plans:
          type: array
          items:
            type: object
            required: [id, ref, status, tier, options, priceMonthlyPence, mandateStatus, activatedAt, cancelledAt, paymentFailedAt, cancellations]
            properties:
              id: { type: string }
              ref: { type: string }
              status: { $ref: "#/components/schemas/PlanStatus" }
              tier: { type: [string, "null"] }
              options: { type: array, items: { type: string } }
              priceMonthlyPence: { type: [integer, "null"] }
              mandateStatus: { type: [string, "null"] }
              activatedAt: { type: [string, "null"] }
              cancelledAt: { type: [string, "null"] }
              paymentFailedAt: { type: [string, "null"] }
              offer: { type: [object, "null"], properties: { channel: { type: string, enum: [sms, whatsapp] }, sentAt: { type: string, format: date-time }, delivery: { type: string, enum: [delivered, failed, unconfirmed] } } }
              firstPaymentAt: { type: [string, "null"] }
              cancellations: { type: array, items: { type: object, properties: { reason: { type: string }, source: { type: string } } } }
        payments: { type: array, description: "Paid and failed invoices, newest first; £0 trial invoices left out while HIDE_ZERO_INVOICES is on", items: { type: object, required: [id, status, amountPence, feePence, at], properties: { id: { type: string }, status: { type: string, enum: [paid, failed] }, amountPence: { type: integer }, feePence: { type: [integer, "null"] }, at: { type: string, format: date-time } } } }
        zeroInvoicesHidden: { type: integer }
    PackRow:
      type: object
      required: [id, name, firstName, business, businessType, town, address, addressCheck, version, livePage, referralCode, qrLink, requestedAt, verifiedAt, postedAt, heldBecause]
      properties:
        id: { type: string, description: The engineer's ID }
        name: { type: string }
        firstName: { type: [string, "null"] }
        business: { type: string }
        businessType: { type: [string, "null"] }
        town: { type: [string, "null"] }
        address: { type: [string, "null"], description: The postal address as the engineer typed it, one line per line }
        addressCheck: { type: string, enum: [ok, unchecked, missing, registered_office], description: "missing and registered_office are kept out of the print files" }
        version: { type: object, properties: { kind: { type: string, enum: [standard, founding] }, town: { type: [string, "null"] } } }
        livePage: { type: string }
        referralCode: { type: string }
        qrLink: { type: string, description: The link the app's own QR code encodes }
        requestedAt: { type: [string, "null"] }
        verifiedAt: { type: [string, "null"] }
        postedAt: { type: [string, "null"] }
        heldBecause: { type: [string, "null"], enum: [not_verified, paused, banned, null] }
    PackPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [counts, wontPrint]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/PackRow" } }
            counts: { type: object, required: [to_post, held, posted], properties: { to_post: { type: integer }, held: { type: integer }, posted: { type: integer } } }
            wontPrint: { type: [integer, "null"], description: "With count=wont_print on to_post: how many matching packs have an address that won't print (addressCheck not ok). Null otherwise." }
    Week:
      type: object
      required: [weekStart, offers, activeEngineers, value]
      properties: { weekStart: { type: string, format: date }, offers: { type: integer }, activeEngineers: { type: integer }, value: { type: number } }
    Totals:
      type: object
      required: [count, grossPence, refundedPence, claimedPence, netPence, feePence]
      properties: { count: { type: integer }, grossPence: { type: integer }, refundedPence: { type: integer }, claimedPence: { type: integer }, netPence: { type: integer }, feePence: { type: integer } }
    OpenPlans:
      type: object
      description: "live: collecting, blocks deleting. ending: cancelled, running out the paid month. pending: offers not taken up (withdrawn on delete)."
      required: [live, ending, pending]
      properties: { live: { type: integer }, ending: { type: integer }, pending: { type: integer } }
    EngineerAccount:
      type: object
      required: [id, role, name, business, ownerId, email, phone, status, verification, joinedAt, staff, customers, plans, stripeAccount, blocked, untoldCustomers]
      properties:
        id: { type: string }
        role: { type: string, enum: [owner, staff] }
        name: { type: string }
        business: { type: string, description: The owner's business for staff }
        ownerId: { type: [string, "null"] }
        email: { type: string, description: Masked }
        phone: { type: [string, "null"], description: Masked }
        status: { $ref: "#/components/schemas/EngineerStanding" }
        verification: { $ref: "#/components/schemas/VerificationStatus" }
        joinedAt: { type: string, format: date-time }
        staff: { type: integer, description: Staff accounts deleted with an owner }
        customers: { type: integer, description: Customers scrubbed with an owner }
        plans: { $ref: "#/components/schemas/OpenPlans" }
        stripeAccount: { type: boolean, description: Has a Stripe Connect account, left open for TradeSura to close }
        blocked: { type: [string, "null"], description: Why it can't be deleted yet }
        untoldCustomers: { type: integer, description: "Customers on a live plan not yet told the engineer is leaving (POST /accounts/engineers/{engineerId}/tell-customers)" }
    CustomerAccount:
      type: object
      required: [id, name, engineer, email, phone, addedAt, plans, blocked]
      properties:
        id: { type: string }
        name: { type: string }
        engineer: { type: object, required: [id, business], properties: { id: { type: string }, business: { type: string } } }
        email: { type: [string, "null"], description: Masked }
        phone: { type: string, description: Masked }
        addedAt: { type: string, format: date-time }
        plans: { $ref: "#/components/schemas/OpenPlans" }
        blocked: { type: [string, "null"] }
    DeletedAccounts:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [type, id, name, outcome, message]
            properties:
              type: { type: string, enum: [engineer, customer] }
              id: { type: string }
              name: { type: string }
              outcome: { type: string, enum: [deleted, gone, refused, failed], description: "gone: already deleted, or no such record" }
              message: { type: string, description: Written for admins }
  responses:
    Error:
      description: See the Error schema.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

paths:
  /me:
    get:
      summary: Who the token identifies, and their permissions (any admin).
      responses:
        "200": { description: The admin, content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string }, permissions: { type: array, items: { type: string } } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /dashboard/core:
    get:
      summary: "Offers per verified engineer per week: last complete UK week, this week so far, change and a 12-week trend. Needs dashboard:read."
      responses:
        "200":
          description: The core number
          content:
            application/json:
              schema:
                type: object
                required: [lastWeek, previousWeek, weekToDate, change, trend]
                properties:
                  lastWeek: { $ref: "#/components/schemas/Week" }
                  previousWeek: { $ref: "#/components/schemas/Week" }
                  weekToDate: { $ref: "#/components/schemas/Week" }
                  change: { type: number }
                  trend: { type: array, items: { $ref: "#/components/schemas/Week" } }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/stats:
    get:
      summary: "Sign-ups and verified (the funnel's first steps), verified engineers in total, active engineers, live plans, customers on a plan, offers by delivery and offer-to-sign-up, all from lib/admin/metrics.ts, test data and deleted accounts left out. Needs dashboard:read."
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses:
        "200":
          description: Headline numbers
          content:
            application/json:
              schema:
                type: object
                required: [signups, verified, active, activeWindowDays, plansLive, customers, offers, conversion]
                properties:
                  signups: { type: integer, description: "Owner accounts created in the range that still exist: the funnel's first step" }
                  verified: { type: object, required: [ofSignups, total], properties: { ofSignups: { type: integer, description: "Of those, approved since: the funnel's second step" }, total: { type: integer, description: "Verified engineers at the end of the range: the core number's divisor" } } }
                  active: { type: integer, description: "Engineers in good standing with a delivered offer in the activeWindowDays × 24 hours before the end, or before now when the end is still to come: the same set the Engineers list calls active" }
                  activeWindowDays: { type: integer }
                  plansLive: { type: integer }
                  customers: { type: integer }
                  offers: { type: object, required: [delivered, failed, unconfirmed], properties: { delivered: { type: integer }, failed: { type: integer }, unconfirmed: { type: integer, description: WhatsApp offers whose link hasn't been opened } } }
                  conversion: { type: object, required: [sent, converted, rate], properties: { sent: { type: integer }, converted: { type: integer }, rate: { type: number } } }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/signups:
    get:
      summary: Engineer sign-ups by UK day, and how they heard about TradeSura. Needs dashboard:read.
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses:
        "200":
          description: Sign-ups
          content:
            application/json:
              schema:
                type: object
                required: [byDay, channels]
                properties:
                  byDay: { type: array, items: { type: object, required: [date, count], properties: { date: { type: string, format: date }, count: { type: integer } } } }
                  channels: { type: array, items: { type: object, required: [channel, count, share], properties: { channel: { type: string, description: "heardVia; letter only with a redeemed claim code, letter_unverified for the answer alone, not_given for none" }, count: { type: integer }, share: { type: number } } } }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/funnel:
    get:
      summary: "A cohort: engineers who signed up in the range, and how many reached each step and every step before it (so none outgrows the one before), with median days from the step before. Steps in lib/admin/metrics.ts FUNNEL_STEPS order. Needs dashboard:read."
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses:
        "200":
          description: The steps, in order (Signed up, Verified, First plan live, Payments set up, First payment)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [key, label, count, ofStart, fromPrevious, medianDaysFromPrevious, medianOf]
                  properties:
                    key: { type: string, enum: [signed_up, verified, plan_live, payments_set_up, first_payment] }
                    label: { type: string }
                    count: { type: integer }
                    ofStart: { type: number }
                    fromPrevious: { type: number }
                    medianDaysFromPrevious:
                      type: [number, "null"]
                      description: Median days from reaching the step before to reaching this one. A step done before the one before it is reached with it (0 days).
                    medianOf: { type: integer, description: How many engineers in the step the median is over (those whose dates are recorded). }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/money:
    get:
      summary: Collections by UK month (last six) and in the range, from paid Stripe invoices the webhook stored. Needs dashboard:read.
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses:
        "200":
          description: Refunds and claims are 0 until those Stripe events are received.
          content:
            application/json:
              schema:
                type: object
                required: [months, period]
                properties:
                  months: { type: array, items: { allOf: [{ $ref: "#/components/schemas/Totals" }, { type: object, required: [month], properties: { month: { type: string, description: YYYY-MM } } }] } }
                  period: { $ref: "#/components/schemas/Totals" }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/health:
    get:
      summary: Cancellations (rate and top reasons) and failed payments (recovered and outstanding) in the range. Needs dashboard:read.
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses:
        "200":
          description: Cancellations and failed payments
          content:
            application/json:
              schema:
                type: object
                required: [cancellations, failed]
                properties:
                  cancellations:
                    type: object
                    required: [count, rate, activeAtStart, topReasons]
                    properties:
                      count: { type: integer }
                      rate: { type: number }
                      activeAtStart: { type: integer }
                      topReasons: { type: array, items: { type: object, properties: { reason: { type: string }, count: { type: integer } } } }
                  failed:
                    type: object
                    required: [count, failedPence, recovered, recoveredPence, outstanding, outstandingPence, recoveryRate]
                    properties:
                      count: { type: integer }
                      failedPence: { type: integer }
                      recovered: { type: integer }
                      recoveredPence: { type: integer }
                      outstanding: { type: integer }
                      outstandingPence: { type: integer }
                      recoveryRate: { type: number }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/waiting:
    get:
      summary: What's waiting on the team now. Needs dashboard:read.
      responses:
        "200": { description: Counts, content: { application/json: { schema: { type: object, required: [verifications, memberPacks, cancelRequests], properties: { verifications: { type: integer }, memberPacks: { type: integer }, cancelRequests: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /verifications:
    get:
      summary: "The Gas Safe check, live first (Matt, 4 Nov): the card check passes the engineer live, the register check on the live Gas Safe Register follows. Never checked against a stored copy. Items carry stage, cardCheck (waiting|passed|failed|no_card), registerCheck (due|recheck_due|passed|suspended), licenceNo and registrationNo. Needs verification:read. No contact details (checkers see it)."
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [card, register, no_card, recheck, duplicates, pending, decided], default: pending }, description: "card: card check waiting; register: live, register check due; no_card: waiting for a card photo; recheck: register re-check due (card expiry + 14 days, a year on, a new card, or asked for); duplicates: open cases sharing a company number, Gas Safe registration number, business name, or name and postcode (staff only as people); pending: card, register and recheck; decided: register check passed, card check failed or suspended, latest first" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Name, business, licence, registration or company number }
        - { name: sort, in: query, schema: { type: string, enum: [submitted, decided, name, business] }, description: business is the name as shown (trading name, else legal name) }
        - { $ref: "#/components/parameters/dir" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: A page, plus counts per tab, content: { application/json: { schema: { $ref: "#/components/schemas/VerificationPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /verifications/{engineerId}:
    get:
      summary: "One case (the engineer's): stage and tab, checks (card, register, liveSince, registerCheckedAt, nextRecheck, recheckRequested, suspended), history of check steps, gasSafe (licenceNo, registrationNo, registerUrl), Companies House officers, duplicate signals, warnings (incl. card_expiry_far over 13 months, was_suspended), customersOnPlans, claim and place in its tab. Needs verification:read."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200": { description: The application, content: { application/json: { schema: { $ref: "#/components/schemas/VerificationDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /verifications/{engineerId}/card:
    get:
      summary: The ID-card photo, fetched on the server from Vercel Blob (never any other host). Needs verification:read.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200": { description: "The image (Cache-Control: private, no-store)", content: { "image/*": {} } }
        default: { $ref: "#/components/responses/Error" }
  /verifications/{engineerId}/claim:
    post:
      summary: "Claim a waiting application while checking it (15 minutes, refreshed while open). Claims on one application are taken one at a time, so two admins can't both get it, and the start of a check is recorded once. Needs verification:decide."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200":
          description: claimed false with a lock means another admin holds it.
          content: { application/json: { schema: { type: object, required: [claimed, lock], properties: { claimed: { type: boolean }, lock: { $ref: "#/components/schemas/Lock" } } } } }
        default: { $ref: "#/components/responses/Error" }
  /verifications/{engineerId}/decision:
    post:
      summary: "The card check: approve puts the engineer live straight away (badge, town page, offers) with the register check due; it needs a card photo (409 without). Reject fails it with the reason they're told. The engineer is told by push, text and email once the answer has gone back (each send gives up after 10 seconds). Needs verification:decide."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: false, required: [decision], properties: { decision: { const: approve }, reason: { type: string, maxLength: 500, description: A note }, revision: { type: string, description: The application's revision when it was opened } } }
                - type: object
                  additionalProperties: false
                  required: [decision, reason]
                  properties:
                    decision: { const: reject }
                    reason: { type: string, minLength: 3, maxLength: 500 }
                    note: { type: string, maxLength: 500, description: "The checker's own words; kept with the reason as \"reason: note\", which is what the engineer is told" }
                    duplicateOf: { type: string, description: The existing account it duplicates }
                    revision: { type: string, description: The application's revision when it was opened }
      responses:
        "200":
          description: nextId is the next waiting application in the same tab.
          content: { application/json: { schema: { type: object, required: [id, outcome, decidedAt, nextId], properties: { id: { type: string }, outcome: { type: string, enum: [verified, rejected] }, decidedAt: { type: string, format: date-time }, nextId: { type: [string, "null"] } } } } }
        "409": { description: "Already decided, another admin is checking it, or it changed since it was opened (revision)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }

  /verifications/{engineerId}/register-check:
    post:
      summary: "Register check passed, for a live engineer whose register check or re-check is due: note says what the live Gas Safe Register showed. Member packs post only after this. 409 if it isn't due, another admin holds the case, or it changed (revision). Needs verification:decide."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [note], properties: { note: { type: string, minLength: 2, maxLength: 500 }, revision: { type: string } } } } } }
      responses:
        "200": { description: nextId is the next case in the same tab, content: { application/json: { schema: { type: object, required: [id, checkedAt, nextId], properties: { id: { type: string }, checkedAt: { type: string, format: date-time }, nextId: { type: [string, "null"] } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /verifications/{engineerId}/suspend:
    post:
      summary: "Suspend a live engineer after a failed register check: badge down, off the town page, offers stopped (gasSafeVerifiedAt cleared), the engineer told why; with tellCustomers, each customer on a live plan is offered a nearby engineer. 409 unless live. Needs verification:decide."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 }, tellCustomers: { type: boolean, default: false }, revision: { type: string } } } } } }
      responses:
        "200": { description: Suspended, content: { application/json: { schema: { type: object, required: [id, suspendedAt, nextId], properties: { id: { type: string }, suspendedAt: { type: string, format: date-time }, nextId: { type: [string, "null"] } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /verifications/{engineerId}/recheck:
    post:
      summary: "Ask for a register re-check out of turn (a homeowner's safety complaint); the engineer stays live. 409 unless their register check has passed. Needs verification:decide."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        "200": { description: Asked for, content: { application/json: { schema: { type: object, required: [id, requestedAt], properties: { id: { type: string }, requestedAt: { type: string, format: date-time } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/tiers/{tierId}/take-down:
    post:
      summary: "Take a plan that breaks the rules off sale: status STOPPED, customers on it keep it, the engineer told why by text, push and email, recorded as plan_taken_down. 409 unless it's on sale. Needs engineers:status."
      parameters: [{ $ref: "#/components/parameters/engineerId" }, { name: tierId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } } }
      responses:
        "200": { description: Taken down, content: { application/json: { schema: { type: object, required: [id, status], properties: { id: { type: string }, status: { const: STOPPED } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /verifications/{engineerId}/chase:
    post:
      summary: Ask a waiting applicant for a missing card photo (what photo) or to check their details (what details), by text or email. A text needs their consent to setup texts (409 without). Recorded. Needs verification:decide.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { content: { application/json: { schema: { type: object, required: [what, channel], properties: { what: { type: string, enum: [photo, details] }, channel: { type: string, enum: [sms, email] } } } } } }
      responses:
        "200":
          description: "Whether it went: chased false, with notSent, when text or email isn't set up on this server (not_configured) or the provider refused it (refused). Recorded as verification_chased or verification_chase_failed."
          content:
            application/json:
              schema:
                type: object
                required: [chased, channel, notSent]
                properties:
                  chased: { type: boolean }
                  channel: { type: string, enum: [sms, email] }
                  notSent: { type: [string, "null"], enum: [not_configured, refused, null] }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /member-packs:
    get:
      summary: Founding-member packs. to_post is badge live and not paused or banned; held is waiting on one of those; posted is done, latest first. Includes postal addresses. Needs member_packs:read.
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [to_post, held, posted], default: to_post } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Name, business or address }
        - { name: count, in: query, schema: { type: string, enum: [wont_print] }, description: "On to_post, also count the matching packs whose address won't print (wontPrint). Checks every one, so ask only when it's shown." }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: A page, plus counts per tab, content: { application/json: { schema: { $ref: "#/components/schemas/PackPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /member-packs/{engineerId}/posted:
    post:
      summary: Mark the engineer's pack as posted. Recorded as member_pack_shipped. Needs member_packs:mark_posted.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200": { description: Posted, content: { application/json: { schema: { type: object, required: [id, postedAt], properties: { id: { type: string }, postedAt: { type: string, format: date-time } } } } } }
        "409": { description: "Already posted, never requested, or held (not verified, paused or banned)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /member-packs/posted:
    post:
      summary: Mark several packs as posted on one day (today if not given). Each goes only if it may; the rest come back with the reason. One member_pack_shipped event each. Needs member_packs:mark_posted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [engineerIds]
              properties:
                engineerIds: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                postedOn: { type: string, format: date, description: Not in the future }
      responses:
        "200":
          description: Which were posted, and why the others weren't
          content:
            application/json:
              schema:
                type: object
                required: [posted, postedAt, skipped]
                properties:
                  posted: { type: array, items: { type: string } }
                  postedAt: { type: string, format: date-time }
                  skipped: { type: array, items: { type: object, required: [id, reason], properties: { id: { type: string }, reason: { type: string } } } }
        default: { $ref: "#/components/responses/Error" }

  /letters/batches:
    get:
      summary: "Letter batches (Matt, 4 Nov), newest first, with each one's codes, claimed on the claim page, signed up and opted out. Needs letters:read."
      responses:
        "200":
          description: Every batch
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, reservedUntil, codes, claimed, signedUp, suppressed, uploadedAt, uploadedBy]
                      properties:
                        name: { type: string, description: "2026-11-A: the month, then A, B…" }
                        reservedUntil: { type: string, format: date, description: "The reservation date the letters print (for batches from before uploads, the letter date Founding judges them by)" }
                        codes: { type: integer }
                        claimed: { type: integer, description: Confirmed their details on the claim page }
                        signedUp: { type: integer }
                        suppressed: { type: integer, description: Opted out; left out of the mail house's file }
                        uploadedAt: { type: string, format: date-time }
                        uploadedBy: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: "Upload a batch from our engineer list: every row becomes a reserved ClaimCode at once (SMITH-7K3Q: the surname, else the business name, then four random characters), with the town and reservation date its letter prints, or none do. The reservation date is also the batch's Founding deadline. Up to 5,000 rows (about 2 MB). Recorded as letter_batch_uploaded. Needs letters:write."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reservedUntil, rows]
              properties:
                reservedUntil: { type: string, format: date, description: After today, within a year }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    additionalProperties: false
                    required: [businessName, firstName, town]
                    properties:
                      businessName: { type: string, maxLength: 120 }
                      firstName: { type: string, maxLength: 60, description: The owner's }
                      lastName: { type: string, maxLength: 60, description: "The code starts with it when given, else with the business name" }
                      town: { type: string, maxLength: 80, description: Printed on the letter; the town of their Founding place }
                      mailingAddress: { $ref: "#/components/schemas/PostalAddress" }
                      variant: { type: string, enum: [A, B, C, D], description: "The letter's split-test version; A when left out" }
      responses:
        "200": { description: The batch, content: { application/json: { schema: { type: object, required: [name, count, reservedUntil], properties: { name: { type: string }, count: { type: integer }, reservedUntil: { type: string, format: date } } } } } }
        "409": { description: 26 batches this month already, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /letters/batches/{batch}/mail-house:
    get:
      summary: "The mail house's file for one batch: business name, owner first name, town, reservation date, code, QR link (the claim page, /c/CODE) and the mailing address, by town then business. Codes whose owner opted out are left out and counted. Back office only: the claim page and app never show the list's data beyond the business name and town. Needs letters:export."
      parameters: [{ name: batch, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The letters to post
          content:
            application/json:
              schema:
                type: object
                required: [batch, suppressed, rows]
                properties:
                  batch: { type: string }
                  suppressed: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [businessName, firstName, town, reservedUntil, code, link, mailingAddress]
                      properties:
                        businessName: { type: string }
                        firstName: { type: string }
                        town: { type: [string, "null"] }
                        reservedUntil: { type: string, format: date }
                        code: { type: string }
                        link: { type: string, format: uri }
                        mailingAddress: { type: [object, "null"], properties: { lines: { type: array, items: { type: string } }, town: { type: string }, postcode: { type: string } } }
        "404": { description: No batch by that name, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }

  /towns:
    get:
      summary: "Founding Members and town pages (Matt, 4 Nov): every town with a page, an engineer or a top spot, A–Z. Taken: top spots held now, of spots. Live: held spots showing on the public town page. Released: spots given up, ever. Next in line: complete Founding Members who've never held one of the town's spots, who'd get the next free one. Needs towns:read."
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Part of the town's name }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [slug, name, page, spots, taken, live, released, nextInLine, foundingMembers, listed]
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        page: { $ref: "#/components/schemas/TownPageState" }
                        spots: { type: integer, description: "The town's top spots (3)" }
                        taken: { type: integer }
                        live: { type: integer }
                        released: { type: integer }
                        nextInLine: { type: integer }
                        foundingMembers: { type: integer }
                        listed: { type: integer, description: Engineers the town page lists }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /towns/{slug}:
    get:
      summary: "One town: its top spots in order (with the 60-day clock, reminders sent, whether a customer has signed, whether it's live on the page, and the admin's reason if one was given out of turn), the spots released (why, and by whom if an admin), who's next in line, the town page's order (lib/founding.ts townPageOrder: top spots › paying customers, ties by reviews › reviews by number, average, recency) and who an admin could give a spot to. Needs towns:read."
      parameters: [{ $ref: "#/components/parameters/slug" }]
      responses:
        "200":
          description: The town
          content:
            application/json:
              schema:
                type: object
                required: [slug, name, page, url, rules, spots, released, nextInLine, order, eligible, leadWindowMinutes]
                properties:
                  slug: { type: string }
                  name: { type: string }
                  page: { $ref: "#/components/schemas/TownPageState" }
                  url: { type: string, format: uri, description: The public town page }
                  rules: { type: object, required: [spotsPerTown, spotDays, reminderDays], properties: { spotsPerTown: { type: integer }, spotDays: { type: integer }, reminderDays: { type: array, items: { type: integer } } } }
                  spots:
                    type: array
                    items:
                      type: object
                      required: [id, position, engineer, heldFrom, endsAt, daysLeft, customerSigned, remindersSent, live, given]
                      properties:
                        id: { type: string }
                        position: { type: integer }
                        engineer: { $ref: "#/components/schemas/TownPerson" }
                        heldFrom: { type: string, format: date-time }
                        endsAt: { type: string, format: date-time, description: When it's released without a customer }
                        daysLeft: { type: integer }
                        customerSigned: { type: boolean, description: The spot is theirs to keep }
                        remindersSent: { type: array, items: { type: integer }, description: Days left at each reminder sent }
                        live: { type: boolean, description: On the public town page now }
                        given: { type: [object, "null"], properties: { by: { type: [string, "null"] }, reason: { type: [string, "null"] } }, description: Given by an admin out of turn }
                  released:
                    type: array
                    items:
                      type: object
                      required: [id, engineer, heldFrom, releasedAt, reason, by, note]
                      properties:
                        id: { type: string }
                        engineer: { $ref: "#/components/schemas/TownPerson" }
                        heldFrom: { type: string, format: date-time }
                        releasedAt: { type: string, format: date-time }
                        reason: { type: [string, "null"], enum: [no_customer, left_town, account_closed, admin, null] }
                        by: { type: [string, "null"], description: The admin, when an admin released it }
                        note: { type: [string, "null"], description: The admin's reason }
                  nextInLine:
                    type: array
                    items: { allOf: [{ $ref: "#/components/schemas/TownPerson" }, { type: object, required: [completedAt], properties: { completedAt: { type: string, format: date-time } } }] }
                  order:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/TownPerson" }
                        - type: object
                          required: [position, group, payingCustomers, reviews]
                          properties:
                            position: { type: integer }
                            group: { type: string, enum: [top_spot, most_active, reviews] }
                            payingCustomers: { type: integer, description: Direct Debit active and not cancelling }
                            reviews: { type: object, required: [count, average, lastAt], properties: { count: { type: integer }, average: { type: [number, "null"] }, lastAt: { type: [string, "null"], format: date-time } } }
                  eligible:
                    type: array
                    items: { allOf: [{ $ref: "#/components/schemas/TownPerson" }, { type: object, required: [owner, founding, nextInLine], properties: { owner: { type: [string, "null"], description: "The owner's name, to tell apart businesses with the same name" }, founding: { type: boolean }, nextInLine: { type: boolean } } }] }
                  leadWindowMinutes: { type: integer }
        "404": { description: No town by that name, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /towns/{slug}/spots:
    post:
      summary: "The manual override: give a free top spot to an engineer who works in the town and holds none, out of turn. Its 60-day clock starts now; they're told as the app tells anyone given a spot. Recorded as top_spot_awarded (actor ADMIN, with the reason as note). Needs towns:write."
      parameters: [{ $ref: "#/components/parameters/slug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [engineerId, reason]
              properties:
                engineerId: { type: string }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200": { description: Given, content: { application/json: { schema: { type: object, required: [spotId, givenTo], properties: { spotId: { type: string }, givenTo: { $ref: "#/components/schemas/TownPerson" } } } } } }
        "409": { description: "The town's spots are all taken, or they hold one already", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /towns/{slug}/spots/{spotId}/release:
    post:
      summary: "The manual override: release a top spot before its time. With to: null it passes to the next in line, as when the app releases one; otherwise to that engineer (in the town, holding none). Released by an admin, the engineer isn't next in line for the town's spots again. Recorded as top_spot_released (reason admin, note the admin's reason). Needs towns:write."
      parameters: [{ $ref: "#/components/parameters/slug" }, { name: spotId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, to]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                to: { type: [string, "null"], description: "An engineer ID, or null for the next in line" }
      responses:
        "200": { description: Released, content: { application/json: { schema: { type: object, required: [released, givenTo], properties: { released: { type: string, description: The engineer who held it }, givenTo: { oneOf: [{ $ref: "#/components/schemas/TownPerson" }, { type: "null" }], description: "Who has it now; null while nobody's next in line" } } } } } }
        "404": { description: No such spot in this town, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Already released, or the chosen engineer holds a spot", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /settings/town-leads:
    get:
      summary: "How long a town's Founding Members get first pick of a homeowner request from its town page before everyone there sees it (lib/town-leads.ts; Matt: about 2 hours). Needs towns:read."
      responses:
        "200": { description: The window, content: { application/json: { schema: { type: object, required: [minutes, defaultMinutes, maxMinutes], properties: { minutes: { type: integer }, defaultMinutes: { type: integer }, maxMinutes: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: "Change it, for requests made from now on (0 opens them to everyone at once). Recorded as town_lead_window_changed. Needs towns:write."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [minutes], properties: { minutes: { type: integer, minimum: 0, maximum: 1440 } } }
      responses:
        "200": { description: Changed, content: { application/json: { schema: { type: object, required: [minutes, before], properties: { minutes: { type: integer }, before: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }

  /engineers:
    get:
      summary: Every engineer account (deleted ones excepted). Needs engineers:read.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Name, business, slug, town, postcode, email; Gas Safe, phone or company number by digits }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, paused, banned, left] }, description: Active and inactive as EngineerStatus }
        - { name: verification, in: query, schema: { type: string, enum: [verified, pending, rejected, not_submitted] } }
        - { name: step, in: query, schema: { type: string, enum: [signed_up, verified, plan_live, payments_set_up, first_payment] }, description: "The furthest funnel step reached, taking the steps in order" }
        - { name: town, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [sole_trader, ltd, partnership] } }
        - { name: channel, in: query, schema: { type: string, enum: [letter, email, engineer, online, other] } }
        - { name: staff, in: query, schema: { type: string, enum: [owners, staff] } }
        - { name: joinedFrom, in: query, schema: { type: string, format: date } }
        - { name: joinedTo, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [joined, name, business, plans, tiers, customers, customersOnPlans, lastOffer] }, description: Each orders by the field of the same meaning in EngineerRow; business by the name as shown }
        - { $ref: "#/components/parameters/dir" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: A page, content: { application/json: { schema: { $ref: "#/components/schemas/EngineerPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/export:
    get:
      summary: Every engineer the list's filters match (same parameters, no paging or sort), newest first, as NDJSON for a CSV export. Needs engineers:read.
      responses:
        "200": { description: "One EngineerRow per line, then {\"end\":true,\"count\":N}", content: { application/x-ndjson: {} } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/filter-options:
    get:
      summary: Towns and sign-up channels in use. Needs engineers:read.
      responses:
        "200": { description: In use, content: { application/json: { schema: { type: object, required: [towns, channels], properties: { towns: { type: array, items: { type: string } }, channels: { type: array, items: { type: string } } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}:
    get:
      summary: One engineer in full (contact details masked). Needs engineers:read.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200": { description: The engineer, content: { application/json: { schema: { $ref: "#/components/schemas/EngineerDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/activity:
    get:
      summary: The engineer's own actions and anything done to them, newest first. Needs engineers:read.
      parameters: [{ $ref: "#/components/parameters/engineerId" }, { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/size" }]
      responses:
        "200": { description: Activity, content: { application/json: { schema: { $ref: "#/components/schemas/Activity" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/contact:
    post:
      summary: The full email and phone number, the engineer's or a staff member's on their team. Recorded every time, against this engineer, with the staff member and field. Needs pii:reveal.
      parameters:
        - { $ref: "#/components/parameters/engineerId" }
        - { name: staffId, in: query, schema: { type: string }, description: One of this engineer's staff (404 if not on their team) }
        - { name: field, in: query, schema: { type: string, enum: [email, phone] }, description: Just this one }
      responses:
        "200": { description: Contact, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/addresses:
    put:
      summary: "Change the trading address (it sets the town, town page and postcode) and where post goes: correspondence \"same\" or an address of its own (it becomes the pack address). Recorded with the town before and after. Needs engineers:edit."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trading, correspondence]
              properties:
                trading: { $ref: "#/components/schemas/PostalAddress" }
                correspondence: { oneOf: [{ const: same }, { $ref: "#/components/schemas/PostalAddress" }] }
                reason: { type: string }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { type: object, properties: { town: { type: string }, townBefore: { type: [string, "null"] }, correspondenceSameAsTrading: { type: boolean } } } } } }
        "409": { description: A staff engineer (they use the owner's addresses), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/pause:
    post:
      summary: "Pause: no new offers or texts until resumed. Needs engineers:status."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } } }
      responses:
        "200": { description: "The engineer, as GET /engineers/{engineerId}", content: { application/json: { schema: { $ref: "#/components/schemas/EngineerDetail" } } } }
        "409": { description: Already paused or banned, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/resume:
    post:
      summary: Lift a pause. Needs engineers:status.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: The engineer, content: { application/json: { schema: { $ref: "#/components/schemas/EngineerDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/ban:
    post:
      summary: "Ban: off town pages and enquiries, and no new offers or texts. Needs engineers:ban."
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } } }
      responses:
        "200": { description: The engineer, content: { application/json: { schema: { $ref: "#/components/schemas/EngineerDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/unban:
    post:
      summary: Lift a ban. Needs engineers:ban.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } } }
      responses:
        "200": { description: The engineer, content: { application/json: { schema: { $ref: "#/components/schemas/EngineerDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/widget:
    post:
      summary: Switch the website widget off or back on. Needs engineers:status.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [disabled], properties: { disabled: { type: boolean }, reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: The engineer, content: { application/json: { schema: { $ref: "#/components/schemas/EngineerDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/test-data:
    post:
      summary: Mark the engineer as test data, with their customers, offers and payments. Recorded. Needs data:delete.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: Marked, content: { application/json: { schema: { $ref: "#/components/schemas/TestMark" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Count the engineer again. Recorded. Needs data:delete.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: Unmarked, content: { application/json: { schema: { $ref: "#/components/schemas/TestMark" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/notes:
    get:
      summary: Staff notes, newest first. Needs engineers:read.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200": { description: Notes, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Note" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Add a note. Needs engineers:notes.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteBody" } } } }
      responses:
        "200": { description: The note, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        default: { $ref: "#/components/responses/Error" }
  /engineers/{engineerId}/notes/{noteId}:
    delete:
      summary: Remove a note (hidden, not erased). Only its author or a super-admin (403 otherwise). Needs engineers:notes.
      parameters: [{ $ref: "#/components/parameters/engineerId" }, { $ref: "#/components/parameters/noteId" }]
      responses:
        "200": { description: Removed, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        default: { $ref: "#/components/responses/Error" }

  /customers:
    get:
      summary: Every homeowner on every engineer's book (contact details masked). Needs customers:read.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Name, email, postcode, first address line, plan reference; phone by digits }
        - { name: engineerId, in: query, schema: { type: string } }
        - { name: plan, in: query, schema: { type: string, enum: [active, pending, paused, cancelled, none] } }
        - { name: payment, in: query, schema: { type: string, enum: [failing, paid, none] } }
        - { name: cancelledFrom, in: query, schema: { type: string, format: date } }
        - { name: cancelledTo, in: query, schema: { type: string, format: date } }
        - { name: source, in: query, schema: { type: string, enum: [added, doorstep, web, website, import, contacts] } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CustomerStatus" } }
        - { name: sort, in: query, schema: { type: string, enum: [added, name, since, postcode, engineer, price] }, description: Each orders by the value shown (see CustomerRow); blanks last }
        - { $ref: "#/components/parameters/dir" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200": { description: A page, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /customers/export:
    get:
      summary: Every customer the list's filters match (same parameters, no paging or sort), newest first, as NDJSON for a CSV export. Needs customers:read.
      responses:
        "200": { description: "One CustomerRow per line, then {\"end\":true,\"count\":N}", content: { application/x-ndjson: {} } }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}:
    get:
      summary: One homeowner, with homes, plans (and what they agreed to), cancellations, ratings and payments from Stripe invoice events. Needs customers:read.
      parameters: [{ $ref: "#/components/parameters/customerId" }]
      responses:
        "200": { description: The customer, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}/activity:
    get:
      summary: Anything recorded about the customer, newest first. Needs customers:read.
      parameters: [{ $ref: "#/components/parameters/customerId" }, { $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/size" }]
      responses:
        "200": { description: Activity, content: { application/json: { schema: { $ref: "#/components/schemas/Activity" } } } }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}/contact:
    post:
      summary: The full phone number and email. Recorded every time, with the field. Needs pii:reveal.
      parameters:
        - { $ref: "#/components/parameters/customerId" }
        - { name: field, in: query, schema: { type: string, enum: [email, phone] }, description: Just this one }
      responses:
        "200": { description: Contact, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}/test-data:
    post:
      summary: Mark the customer as test data, with their plans and payments. Recorded. Needs data:delete.
      parameters: [{ $ref: "#/components/parameters/customerId" }]
      responses:
        "200": { description: Marked, content: { application/json: { schema: { $ref: "#/components/schemas/TestMark" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Count the customer again. Recorded. Needs data:delete.
      parameters: [{ $ref: "#/components/parameters/customerId" }]
      responses:
        "200": { description: Unmarked, content: { application/json: { schema: { $ref: "#/components/schemas/TestMark" } } } }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}/win-back:
    post:
      summary: Text a customer whose plan has ended the app's win-back message with their rejoin link (sent, queued until 08:00, or not sent and why). Refused (409) for anyone opted out or still on a plan. Recorded (customer_win_back_sent, or customer_win_back_failed). Needs customers:contact.
      parameters: [{ $ref: "#/components/parameters/customerId" }]
      responses:
        "200":
          description: Sent, queued, or not sent (texts not set up on this server, or Twilio refused it)
          content:
            application/json:
              schema:
                type: object
                required: [status, notSent]
                properties:
                  status: { type: string, enum: [sent, queued, not_sent] }
                  notSent: { type: [string, "null"], enum: [not_configured, refused, null] }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}/notes:
    get:
      summary: Staff notes, newest first. Needs customers:read.
      parameters: [{ $ref: "#/components/parameters/customerId" }]
      responses:
        "200": { description: Notes, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Note" } } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Add a note. Needs customers:notes.
      parameters: [{ $ref: "#/components/parameters/customerId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteBody" } } } }
      responses:
        "200": { description: The note, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        default: { $ref: "#/components/responses/Error" }
  /customers/{customerId}/notes/{noteId}:
    delete:
      summary: Remove a note (hidden, not erased). Only its author or a super-admin (403 otherwise). Needs customers:notes.
      parameters: [{ $ref: "#/components/parameters/customerId" }, { $ref: "#/components/parameters/noteId" }]
      responses:
        "200": { description: Removed, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        default: { $ref: "#/components/responses/Error" }

  /accounts/engineers:
    get:
      summary: Engineer accounts (owners and staff), newest first, with what deleting each would do. Contact details masked. Needs data:delete.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 500 }, description: "As the engineer list's search (a whole email or phone number, never a fragment); several at once separated by commas" }
        - { name: role, in: query, schema: { type: string, enum: [owner, staff] } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EngineerStatus" } }
        - { name: deletable, in: query, schema: { type: string, enum: ["yes", "no"] }, description: "no: an owner with a live customer plan" }
        - { name: joinedFrom, in: query, schema: { type: string, format: date } }
        - { name: joinedTo, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [joined] } }
        - { $ref: "#/components/parameters/dir" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: A page
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/EngineerAccount" } } } }] } } }
        default: { $ref: "#/components/responses/Error" }
  /accounts/engineers/{engineerId}/tell-customers:
    post:
      summary: Before a leaving engineer is deleted, tell every customer on one of their live plans, offering TradeSura engineers near them (lib/installer-leaves.ts offerNearbyEngineers, by text and email). Recorded. Needs data:delete.
      parameters: [{ $ref: "#/components/parameters/engineerId" }]
      responses:
        "200": { description: Told, content: { application/json: { schema: { type: object, properties: { offered: { type: integer } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /accounts/customers:
    get:
      summary: Customers on every engineer's book, newest first, with what deleting each would do. Contact details masked. Needs data:delete.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 500 }, description: "As the customer list's search; several at once separated by commas" }
        - { name: deletable, in: query, schema: { type: string, enum: ["yes", "no"] }, description: "no: on a plan that hasn't ended" }
        - { name: addedFrom, in: query, schema: { type: string, format: date } }
        - { name: addedTo, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [added] } }
        - { $ref: "#/components/parameters/dir" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/size" }
      responses:
        "200":
          description: A page
          content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/CustomerAccount" } } } }] } } }
        default: { $ref: "#/components/responses/Error" }
  /accounts/delete:
    post:
      summary: >-
        Delete engineers and customers. An engineer is deleted as the app's "Delete my account" does it: anonymised, so the
        email, mobile, Gas Safe number and Apple ID can sign up again; an owner takes their staff and customers with them,
        and is refused while a customer plan is live. A customer has their homes removed and details scrubbed, and is
        refused until their plans have ended. Plans and payments stay. Each is handled on its own. Needs data:delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                engineerIds: { type: array, maxItems: 20, items: { type: string } }
                customerIds: { type: array, maxItems: 20, items: { type: string } }
                reason: { type: string, maxLength: 500, description: Optional; kept on each event when given }
      responses:
        "200": { description: What happened to each, content: { application/json: { schema: { $ref: "#/components/schemas/DeletedAccounts" } } } }
        default: { $ref: "#/components/responses/Error" }
