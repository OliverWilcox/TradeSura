openapi: 3.1.0
info:
  title: TradeSura admin API
  version: "1"
  description: |
    The API the TradeSura Admin app (a separate Next.js app) uses for real data.
    Server to server only: no browser calls it, and it isn't for the engineers'
    mobile app (those routes are under /api and unchanged).

    **Auth.** Every call carries `Authorization: Bearer <token>`: an HS256 JWT
    signed with `ADMIN_API_SECRET`, issuer `tradesura-admin`, audience
    `tradesura-api:admin`, living at most 120 seconds (the admin app signs one
    per call, for 60). Claims: `sub` (the admin's ID), `name`, `role`, `perms`
    (the permissions their role holds, from the list in
    lib/admin-api/permissions.ts) and optional `rid` (the admin app's request
    ID). Each route names the permission it needs; it's checked here as well
    as in the admin app. Engineers' app tokens (SESSION_SECRET) are never
    accepted, and the two secrets must differ.

    **Errors.** Every failure is `{ "error": { "code", "message", "fields"? } }`
    with a status code: 400 VALIDATION (fields names each bad field, and the
    message is the first field's own message when no other is given), 401
    UNAUTHENTICATED, 403 FORBIDDEN, 404 NOT_FOUND, 409 CONFLICT, 413, 415, 503
    NOT_CONFIGURED (ADMIN_API_SECRET unset), 503 TIMEOUT (a heavy read ran past
    10 seconds and Postgres stopped it; try a shorter range), 500 INTERNAL.
    Messages are written for admins and safe to show. Unknown query or body
    fields are refused, as is any text containing a NUL character (400), and
    dates outside 2000–2099 (400). Search text is matched literally: % and _
    aren't wildcards.

    **Lists** take `page` (from 1) and `size` (1–100, default 25) and answer
    `{ items, page, size, total }`. Each sort orders by the value its column
    shows. The engineer and customer lists also stream whole, for CSV
    exports, as NDJSON (`…/export`): one item per line, then
    `{"end":true,"count":N}`; a stream without that last line didn't finish.

    **Audit.** Every change is an Event row with actor type ADMIN, the admin's
    name and role, the request ID and the reason given.

    **Responses** are never cached (`Cache-Control: no-store`) and echo
    `X-Request-Id`.
servers:
  - url: /api/admin/v1
security:
  - adminToken: []

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    dir: { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
    from: { name: from, in: query, required: true, description: Start of the range (ISO instant, inclusive), schema: { type: string, format: date-time } }
    to: { name: to, in: query, required: true, description: End of the range (ISO instant, exclusive; at most 400 days after from), schema: { type: string, format: date-time } }
    engineerId: { name: engineerId, in: path, required: true, schema: { type: string } }
    customerId: { name: customerId, in: path, required: true, schema: { type: string } }
    noteId: { name: noteId, in: path, required: true, schema: { type: string } }
    slug: { name: slug, in: path, required: true, schema: { type: string }, description: "The town's slug (holmfirth)" }
  schemas:
    TownPageState: { type: string, enum: [public, held, not_public], description: "Public: on the web. Held: an admin is holding it back. Not public: nobody listed there yet." }
    TownPerson: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, NOT_CONFIGURED, UPSTREAM, TIMEOUT, INTERNAL] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: array, items: { type: string } } }
    Page:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    NoteBody:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    Note:
      type: object
      properties:
        id: { type: string }
        body: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }
    Activity:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string, description: Event name, e.g. engineer_paused, offer_sent }
                  at: { type: string, format: date-time }
                  actor: { type: object, properties: { type: { type: string, enum: [ENGINEER, CUSTOMER, SYSTEM, ADMIN] }, id: { type: [string, "null"] }, name: { type: [string, "null"] } } }
                  reason: { type: [string, "null"] }
    Review:
      type: object
      required: [id, stars, low, comment, customer, source, plan, ratedAt, reply, removed]
      properties:
        id: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        low: { type: boolean, description: "1 or 2 stars: the app alerted the installer and TradeSura when it came in" }
        comment: { type: [string, "null"] }
        customer: { type: string, description: As shown publicly, first name and initial }
        source: { type: string, enum: [service, offer], description: After a logged service (plan holders), or at the job }
        plan: { type: [object, "null"], properties: { ref: { type: string }, name: { type: [string, "null"] } } }
        ratedAt: { type: string, format: date-time }
        reply: { type: [object, "null"], properties: { text: { type: string }, at: { type: [string, "null"], format: date-time } } }
        removed: { type: [object, "null"], properties: { at: { type: string, format: date-time }, reason: { type: [string, "null"] } } }
    Reviews:
      type: object
      required: [items, summary, trustpilot]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Review" } }
        trustpilot:
          type: object
          description: "The Trustpilot invite (Matt, 4 Nov, 9.2): emailed once, 3 days after going live, once TRUSTPILOT_REVIEW_URL is set"
          required: [configured, sentAt, dueOn]
          properties: { configured: { type: boolean }, sentAt: { type: [string, "null"], format: date-time }, dueOn: { type: [string, "null"], format: date-time, description: When it's due, if not sent and they're live } }
        summary:
          type: object
          required: [published, average, removed, awaiting]
          properties:
            published: { type: integer }
            average: { type: [number, "null"], description: Of the published ones, to one decimal place }
            removed: { type: integer }
            awaiting: { type: integer, description: Asked for and not answered yet }
    StatementTotals:
      type: object
      required: [collectedPence, feePence, feeRefundedPence, netFeePence, toYouPence]
      properties:
        collectedPence: { type: integer }
        feePence: { type: integer, description: "TradeSura's fee, 20% of each collection rounded down, summed" }
        feeRefundedPence: { type: integer }
        netFeePence: { type: integer }
        toYouPence: { type: integer, description: What the month's collections paid the engineer, less their share of refunds }
    StatementMonth:
      allOf:
        - $ref: "#/components/schemas/StatementTotals"
        - type: object
          required: [month, label, number, collections, refunds]
          properties:
            month: { type: string, pattern: "^20\\d\\d-(0[1-9]|1[0-2])$" }
            label: { type: string, example: October 2026 }
            number: { type: string, description: The statement's own number, as printed }
            collections: { type: integer }
            refunds: { type: integer }
    Statement:
      type: object
      required: [month, label, number, issuedOn, engineer, lines, refunds, totals]
      properties:
        month: { type: string }
        label: { type: string }
        number: { type: string }
        issuedOn: { type: string, description: UK date as printed }
        engineer: { type: object, required: [name, address], properties: { name: { type: string }, address: { type: array, items: { type: string } } } }
        lines:
          type: array
          items: { type: object, required: [date, customer, planRef, collectedPence, feePence], properties: { date: { type: string }, customer: { type: string }, planRef: { type: string }, collectedPence: { type: integer }, feePence: { type: integer } } }
        refunds:
          type: array
          items: { type: object, required: [date, customer, planRef, refundedPence, feeRefundedPence], properties: { date: { type: string }, customer: { type: string }, planRef: { type: string }, refundedPence: { type: integer }, feeRefundedPence: { type: integer } } }
        totals: { $ref: "#/components/schemas/StatementTotals" }
    PhotoSources:
      type: object
      description: "Where each side of the card photo came from, as the app said when it was uploaded; null when it didn't say (builds before 20 Nov) or there's no such side"
      required: [front, back]
      properties:
        front: { type: [string, "null"], enum: [camera, library, null] }
        back: { type: [string, "null"], enum: [camera, library, null] }
    TpsState:
      type: [object, "null"]
      description: "The number's screening against TPS and CTPS: registered or clear when a screening answered in the last 28 days had it; waiting when it's in one not answered yet; null when there's no number"
      required: [status, screenedAt]
      properties:
        status: { type: string, enum: [clear, registered, waiting, not_screened] }
        screenedAt: { type: [string, "null"], format: date-time }
    TpsSummary:
      type: object
      required: [due, waiting, lastAnsweredAt, validDays]
      properties:
        due: { type: integer, description: "Numbers on the call lists not screened in the last validDays days (waiting ones included)" }
        waiting: { type: [object, "null"], required: [id, createdAt, numbers], properties: { id: { type: string }, createdAt: { type: string, format: date-time }, numbers: { type: integer } } }
        lastAnsweredAt: { type: [string, "null"], format: date-time }
        validDays: { type: integer, description: 28 }
    FollowUpLetter:
      type: object
      required: [code, business, owner, town, batch, claimedAt, phone, textConsent, remindedAt, optedOut, lastCall, tps]
      properties:
        code: { type: string }
        business: { type: string, description: From our letter list }
        owner: { type: string, description: The owner's first name from our letter list }
        town: { type: [string, "null"], description: "The town of the trading address they gave, else the letter's" }
        batch: { type: string }
        claimedAt: { type: string, format: date-time }
        phone: { type: string, description: "Masked; the full number comes from POST /letters/codes/{code}/contact" }
        textConsent: { type: boolean }
        remindedAt: { type: [string, "null"], format: date-time }
        optedOut: { type: boolean, description: They replied STOP }
        lastCall: { type: [object, "null"], properties: { at: { type: string, format: date-time }, by: { type: [string, "null"] }, note: { type: [string, "null"] } } }
        tps: { $ref: "#/components/schemas/TpsState" }
    FollowUpPerson:
      type: object
      required: [id, business, owner, town, phone, customersOnPlan, lastCall, tps]
      properties:
        id: { type: string }
        business: { type: string }
        owner: { type: string }
        town: { type: [string, "null"] }
        phone: { type: [string, "null"], description: "Masked; the full number comes from POST /engineers/{engineerId}/contact" }
        customersOnPlan: { type: integer }
        lastCall: { type: [object, "null"], properties: { at: { type: string, format: date-time }, by: { type: [string, "null"] }, note: { type: [string, "null"] } } }
        tps: { $ref: "#/components/schemas/TpsState" }
    FollowUpSend:
      type: object
      required: [step, channel, label, at, went]
      properties:
        step: { type: integer }
        channel: { type: string, enum: [push, whatsapp, email] }
        label: { type: string }
        at: { type: string, format: date-time }
        went: { type: boolean, description: "False when it couldn't go: no device, no phone, no email, or the provider refused it" }
    FollowUpCall:
      allOf:
        - $ref: "#/components/schemas/FollowUpPerson"
        - type: object
          required: [days, countingFrom, lastDeliveredOfferAt, sent]
          properties:
            days: { type: integer }
            countingFrom: { type: string, enum: [last_offer, live] }
            lastDeliveredOfferAt: { type: [string, "null"], format: date-time }
            sent: { type: array, items: { $ref: "#/components/schemas/FollowUpSend" } }
    FollowUpStripe:
      allOf:
        - $ref: "#/components/schemas/FollowUpPerson"
        - type: object
          required: [stripe, chargesEnabled, deadline, daysLeft, urgent]
          properties:
            stripe: { type: object, properties: { stage1: { type: string, enum: [not_started, started, done] }, stage2: { type: string, enum: [waiting, due, done] } } }
            chargesEnabled: { type: boolean, description: Customers can pay in, so an unfinished account holds up payouts }
            deadline: { type: [string, "null"], format: date-time, description: "Stripe's own deadline, kept from account.updated and the record's reads" }
            daysLeft: { type: [integer, "null"] }
            urgent: { type: boolean, description: Within 7 days, or past }
    Contact:
      type: object
      description: Both, or just the one asked for with `field`.
      properties:
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { const: true } }
    Lock:
      type: [object, "null"]
      required: [holderId, holderName, until]
      properties:
        holderId: { type: string }
        holderName: { type: string }
        until: { type: string, format: date-time }
    NameMatch: { type: string, enum: [match, likely, none] }
    TypeMismatch: { type: string, enum: [name_says_company, type_says_company], description: "The name says Ltd, Limited, PLC or LLP and the type isn't a company, or the reverse." }
    CustomerStatus:
      type: string
      enum: [offer_sent, offer_failed, offer_unconfirmed, offer_opened, thinking, dd_started, active, payment_failing, paused, cancelled, no_plan]
      description: "Where a customer is with their current plan (lib/admin/metrics.ts customerStatus): offered (sent, failed, not confirmed, opened), thinking about it, started Direct Debit, active, cancelled."
    TestMark: { type: object, required: [isTest, markedAt, markedBy], properties: { isTest: { type: boolean }, markedAt: { type: [string, "null"] }, markedBy: { type: [string, "null"] } } }
    VerificationStatus: { type: string, enum: [pending, verified, rejected, not_submitted] }
    EngineerStatus: { type: string, enum: [live, not_live], description: "Live: the card check passed with the card's details read, and the account isn't paused, banned or closed (lib/admin/metrics.ts liveWhere). The same everywhere: the list, the record and the dashboard." }
    NotLiveBecause: { type: [string, "null"], enum: [paused, banned, left, suspended, card_failed, card_check, no_card, not_submitted, null], description: "Why an engineer isn't live, worst first; null when live" }
    EngineerStanding: { type: string, enum: [active, paused, banned, left] }
    PlanStatus: { type: string, enum: [PENDING, ACTIVE, PAUSED, CANCELLED] }
    CheckStage: { type: string, enum: [not_submitted, no_card, card, register, recheck, passed, card_failed, suspended], description: "Live first (Matt, 4 Nov): no_card, card (card check waiting), register (live, register check due), recheck, passed, card_failed, suspended" }
    CardCheck: { type: [string, "null"], enum: [waiting, passed, failed, no_card, null], description: passed means live }
    RegisterCheck: { type: [string, "null"], enum: [due, recheck_due, passed, suspended, null], description: On the live Gas Safe Register, behind the card check }
    VerificationRow:
      type: object
      required: [id, name, business, businessType, teamOf, licenceNo, registrationNo, town, cardExpiry, submittedAt, waitingSince, stage, cardCheck, registerCheck, liveSince, nextRecheck, recheckReason, decidedAt, rejectReason, claimedBy, canTextChase, automaticCheck, whyHere, card, badge, registerSearch, signals]
      properties:
        id: { type: string, description: The engineer's ID (a case is the engineer's) }
        name: { type: string }
        business: { type: string }
        businessType: { type: [string, "null"], description: sole_trader, ltd or partnership }
        teamOf: { type: [string, "null"], description: The business a staff engineer works for }
        licenceNo: { type: [string, "null"], description: "The engineer's 7-digit licence number" }
        registrationNo: { type: [string, "null"], description: "The business's Gas Safe registration number (staff: the owner's). Before sign-up asked for both, a single number that isn't 7 digits is read as this." }
        town: { type: [string, "null"] }
        cardExpiry: { type: [string, "null"], format: date, description: "The ID card's expiry, given with the photo; null when not given" }
        submittedAt: { type: string, format: date-time }
        waitingSince: { type: [string, "null"], format: date-time, description: "What the waiting time runs from: the latest card upload (card), going live (register), the re-check falling due or being asked for (recheck)" }
        stage: { $ref: "#/components/schemas/CheckStage" }
        cardCheck: { $ref: "#/components/schemas/CardCheck" }
        registerCheck: { $ref: "#/components/schemas/RegisterCheck" }
        liveSince: { type: [string, "null"], format: date-time }
        standing: { type: [string, "null"], enum: [paused, banned, null], description: "Card check passed but not live: the account is paused or banned" }
        nextRecheck: { type: [string, "null"], format: date }
        recheckReason: { type: [string, "null"] }
        decidedAt: { type: [string, "null"], format: date-time }
        rejectReason: { type: [string, "null"] }
        claimedBy: { type: [string, "null"], description: Who is checking it now }
        canTextChase: { type: boolean }
        automaticCheck: { type: [string, "null"], enum: [passed, failed, waiting, null], description: "The automatic card check's result for the photo on file; null with no photo" }
        whyHere: { type: array, items: { type: string }, description: "Why it's with a person: what's open first, then the check's own state" }
        card: { $ref: "#/components/schemas/CardCheckResult" }
        badge: { $ref: "#/components/schemas/Badge" }
        registerSearch: { $ref: "#/components/schemas/RegisterSearch" }
        signals:
          type: object
          required: [hasCard, fromLibrary, cardExpiryFar, companyNotActive, typeMismatch, duplicates]
          properties:
            hasCard: { type: boolean }
            fromLibrary: { type: boolean, description: "The app said a side of the card was chosen from the photo library, not taken with the camera (camera photos are safer)" }
            cardExpiryFar: { type: boolean, description: The card's expiry is more than 13 months away }
            companyNotActive: { type: boolean }
            typeMismatch: { oneOf: [{ $ref: "#/components/schemas/TypeMismatch" }, { type: "null" }] }
            duplicates: { type: integer }
    Badge: { type: string, enum: [public, hidden], description: "The public Verified badge: public once the card check (with the card read) and the register check have passed, and the account isn't paused or banned" }
    RegisterSearch:
      type: [object, "null"]
      description: "A number read from the card, to search the live Gas Safe Register with (its search takes no number in the link); null until one has been read"
      required: [url, number, kind]
      properties: { url: { type: string }, number: { type: string }, kind: { type: string, enum: [licence, registration] } }
    CardReading:
      type: [object, "null"]
      description: The latest reading of the photo on file, by the automatic check or a checker
      properties:
        source: { type: string, enum: [automatic, checker] }
        outcome: { type: string, enum: [read, not_a_card, unreadable, error, not_set_up] }
        complete: { type: boolean, description: "Licence number, registration number, name and expiry all read: what passing the card check needs" }
        licenceNo: { type: [string, "null"] }
        registrationNo: { type: [string, "null"] }
        name: { type: [string, "null"] }
        company: { type: [string, "null"] }
        expiresOn: { type: [string, "null"], format: date }
        categories: { type: array, items: { type: string }, description: From the back of the card }
        notes: { type: array, items: { type: string } }
        readAt: { type: string, format: date-time }
        readBy: { type: [string, "null"], description: The checker's name, when a checker entered it }
        backRead: { type: boolean }
        suspect: { type: boolean, description: "The reader thought the photo might be a screen, a print or an edited image; a person must look" }
    CardCheckResult:
      type: object
      required: [automatic, details, missing, concerns, passedWithoutDetails]
      properties:
        automatic: { type: [string, "null"], enum: [passed, failed, waiting, null] }
        details: { $ref: "#/components/schemas/CardReading" }
        missing: { type: array, items: { type: string, enum: [licenceNo, registrationNo, name, expiresOn] } }
        concerns: { type: array, items: { type: string }, description: "Mismatches with what they gave and the case's warnings: passing over any needs a reason" }
        passedWithoutDetails: { type: boolean, description: Marked live before cards were read }
    VerificationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [counts]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/VerificationRow" } }
            counts:
              type: object
              required: [card, register, no_card, recheck, duplicates, pending, decided]
              properties:
                card: { type: integer }
                register: { type: integer }
                no_card: { type: integer }
                recheck: { type: integer }
                duplicates: { type: integer }
                pending: { type: integer }
                decided: { type: integer }
    VerificationDetail:
      type: object
      required: [id, name, firstName, lastName, business, businessType, submittedAt, waitingSince, stage, tab, revision, lock, checks, history, gasSafe, submitted, contact, canTextChase, customersOnPlans, card, company, typeMismatch, duplicates, queue, warnings]
      properties:
        id: { type: string }
        name: { type: string }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        business: { type: string }
        tradingName: { type: [string, "null"] }
        legalName: { type: [string, "null"] }
        businessType: { type: [string, "null"] }
        teamOf: { type: [object, "null"], properties: { id: { type: string }, business: { type: string } } }
        submittedAt: { type: string, format: date-time }
        waitingSince: { type: [string, "null"], format: date-time }
        stage: { $ref: "#/components/schemas/CheckStage" }
        tab: { type: [string, "null"], enum: [card, register, no_card, recheck, decided, null] }
        revision: { type: string, description: "Changes whenever anything the check looks at changes. Send it with a step: if it no longer matches, the step is refused (409)." }
        standing: { type: string }
        lock: { $ref: "#/components/schemas/Lock" }
        checks:
          type: object
          properties:
            card: { $ref: "#/components/schemas/CardCheck" }
            register: { $ref: "#/components/schemas/RegisterCheck" }
            liveSince: { type: [string, "null"], format: date-time }
            registerCheckedAt: { type: [string, "null"], format: date-time }
            nextRecheck: { type: [string, "null"], format: date, description: "Card expiry + 14 days, else a year after the last register check" }
            recheckRequested: { type: [object, "null"], properties: { at: { type: string }, reason: { type: [string, "null"] } } }
            suspended: { type: [object, "null"], properties: { at: { type: string }, reason: { type: [string, "null"] } } }
            failedReason: { type: [string, "null"] }
        history:
          type: array
          description: The check's steps, newest first
          items: { type: object, properties: { kind: { type: string, enum: [card_passed, marked_live, card_failed, register_passed, suspended, recheck_requested, reopened], description: "marked_live is a card check passed before cards were read (no reading recorded); reopened is migration 0052 taking such an engineer off live until their card is read" }, at: { type: string }, byName: { type: [string, "null"] }, note: { type: [string, "null"] } } }
        gasSafe:
          type: object
          required: [licenceNo, registrationNo, registerUrl]
          properties:
            licenceNo: { type: [string, "null"] }
            registrationNo: { type: [string, "null"] }
            registerUrl: { type: string, description: The live Gas Safe Register }
        customersOnPlans: { type: integer, description: Customers on a live plan, who can be told if the engineer is suspended }
        submitted:
          type: object
          description: What the engineer gave, to check against the card and the live register. cardExpiry (YYYY-MM-DD) is null until they give it with the photo. Gas categories come only from the back of the card (card.details.categories).
          properties: { name: { type: string }, business: { type: string }, postcode: { type: [string, "null"] }, town: { type: [string, "null"] }, cardExpiry: { type: [string, "null"] } }
        badge: { $ref: "#/components/schemas/Badge" }
        whyHere: { type: array, items: { type: string } }
        registerSearch: { $ref: "#/components/schemas/RegisterSearch" }
